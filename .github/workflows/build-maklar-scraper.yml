name: Build MaklarScraper v2
on:
  push:
    branches: [maklar-scraper-v2]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python test_fmi.py
      - run: pyinstaller --onefile --windowed --name MaklarScraper_v2 maklar_scraper.py
      - uses: actions/upload-artifact@v4
        with:
          name: MaklarScraper_v2
          path: dist/MaklarScraper_v2.exe
          if-no-files-found: error
